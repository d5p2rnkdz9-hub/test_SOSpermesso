[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variabili che contengono indirizzi o modalità pubbliche, non segreti: il loro
# valore (es. https://app.sospermesso.it) compare legittimamente nel codice e
# farebbe fallire la scansione dei segreti di Netlify.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "BETTER_AUTH_URL,NEXT_PUBLIC_PRO_URL,PRO_ACCESS_MODE"
